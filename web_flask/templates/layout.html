<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gempain - Informasi Gempa Bumi Terkini dari BMKG Indonesia">
    <title>Gempain | {% block title %}Informasi Gempa Terkini{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{url_for('static',filename='main.css')}}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid" style="max-width:1200px; margin:0 auto;">
            <a class="navbar-brand" href="/">
                <i class="fas fa-globe-asia"></i>Gempain
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/" id="nav-index"><i class="fas fa-house"></i> Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/home" id="nav-home"><i class="fas fa-table"></i> Data Gempa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/graphic" id="nav-graphic"><i class="fas fa-chart-bar"></i> Grafik</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about" id="nav-about"><i class="fas fa-users"></i> Tentang</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="page-transition animate-in-page">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 <span class="footer-brand">Gempain</span> — Tugas Besar Pemrograman Fungsional</p>
        <div class="footer-links">
            <a href="/">Beranda</a>
            <a href="/home">Data Gempa</a>
            <a href="/graphic">Grafik</a>
            <a href="/about">Tentang</a>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js (for graphic page) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Custom JS -->
    <script src="{{url_for('static',filename='main.js')}}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
