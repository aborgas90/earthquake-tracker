{% extends 'layout.html' %}
{% block title %}Grafik{% endblock %}

{% block content %}
<div class="page-container">
    <!-- Section Header -->
    <div class="section-header">
        <h1><i class="fas fa-chart-bar"></i> Visualisasi Data Gempa</h1>
        <div class="accent-bar"></div>
        <p>Grafik distribusi gempa bumi terkini</p>
    </div>

    <div class="chart-grid">
        <!-- Magnitude Distribution Chart -->
        <div class="chart-card animate-in">
            <h3><i class="fas fa-chart-column"></i> Distribusi Magnitude</h3>
            <canvas id="magnitudeChart"></canvas>
        </div>

        <!-- Regional Chart -->
        <div class="chart-card animate-in">
            <h3><i class="fas fa-chart-pie"></i> Gempa per Wilayah (Top 8)</h3>
            <canvas id="regionalChart"></canvas>
        </div>

        <!-- Depth Chart -->
        <div class="chart-card animate-in">
            <h3><i class="fas fa-chart-area"></i> Distribusi Kedalaman</h3>
            <canvas id="depthChart"></canvas>
        </div>

        <!-- Potensi Chart -->
        <div class="chart-card animate-in">
            <h3><i class="fas fa-water"></i> Potensi Tsunami</h3>
            <canvas id="potensiChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Data from Flask
    const chartData = {{ chart_data|tojson }};

    // Chart.js dark theme defaults
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
    Chart.defaults.font.family = 'Inter';

    const gradientColors = [
        'rgba(6, 182, 212, 0.8)',
        'rgba(139, 92, 246, 0.8)',
        'rgba(34, 197, 94, 0.8)',
        'rgba(249, 115, 22, 0.8)',
        'rgba(239, 68, 68, 0.8)',
        'rgba(234, 179, 8, 0.8)',
        'rgba(236, 72, 153, 0.8)',
        'rgba(59, 130, 246, 0.8)',
    ];

    const gradientBorders = gradientColors.map(c => c.replace('0.8', '1'));

    // 1. Magnitude Distribution
    new Chart(document.getElementById('magnitudeChart'), {
        type: 'bar',
        data: {
            labels: chartData.mag_labels,
            datasets: [{
                label: 'Jumlah Gempa',
                data: chartData.mag_counts,
                backgroundColor: ['rgba(34,197,94,0.7)', 'rgba(234,179,8,0.7)', 'rgba(249,115,22,0.7)', 'rgba(239,68,68,0.7)'],
                borderColor: ['#22c55e', '#eab308', '#f97316', '#ef4444'],
                borderWidth: 1,
                borderRadius: 6,
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
            },
            scales: {
                x: {
                    grid: { display: false, drawBorder: false }
                },
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 },
                    grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false }
                }
            }
        }
    });

    // 2. Regional Chart
    new Chart(document.getElementById('regionalChart'), {
        type: 'doughnut',
        data: {
            labels: chartData.region_labels,
            datasets: [{
                data: chartData.region_counts,
                backgroundColor: gradientColors,
                borderColor: 'rgba(10, 14, 26, 0.9)',
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { padding: 12, usePointStyle: true, pointStyleWidth: 10, font: { size: 11 } }
                }
            }
        }
    });

    // 3. Depth Distribution
    new Chart(document.getElementById('depthChart'), {
        type: 'bar',
        data: {
            labels: chartData.depth_labels,
            datasets: [{
                label: 'Jumlah Gempa',
                data: chartData.depth_counts,
                backgroundColor: 'rgba(139, 92, 246, 0.6)',
                borderColor: '#8b5cf6',
                borderWidth: 1,
                borderRadius: 6,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    grid: { display: false, drawBorder: false }
                },
                y: { 
                    beginAtZero: true, 
                    ticks: { stepSize: 1 },
                    grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false }
                }
            }
        }
    });

    // 4. Potensi Chart
    new Chart(document.getElementById('potensiChart'), {
        type: 'pie',
        data: {
            labels: chartData.potensi_labels,
            datasets: [{
                data: chartData.potensi_counts,
                backgroundColor: ['rgba(34, 197, 94, 0.7)', 'rgba(239, 68, 68, 0.7)'],
                borderColor: 'rgba(10, 14, 26, 0.9)',
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { padding: 12, usePointStyle: true, font: { size: 11 } }
                }
            }
        }
    });
</script>
{% endblock %}
